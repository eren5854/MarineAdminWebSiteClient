<div style="display: flex;">
    <h1>Certificates Page</h1>
    <span (click)="addCard()" style="font-size: 34px; color: green; cursor: pointer;"
        class="material-symbols-outlined ms-3">
        add_circle
    </span>
</div>

<div class="insights">

    <div *ngIf="addCardDiv" class="sales">
        <span class="material-symbols-outlined icons">
            image
        </span>
        <div class="right">
            <div class="input-box">
                <h2>Certificate</h2>
                <form #createCertificateForm="ngForm" (ngSubmit)="createCertificate(createCertificateForm)">
                    <div class="input-field mb-2">
                        <div style="display: flex; gap: 0.5rem; height: 21px;">
                            <label for="title">Title</label>
                        </div>
                        <input [(ngModel)]="certificateModel.title" type="text" name="title"
                            class="form-control"autocomplete="off">
                    </div>

                    <div class="input-field mb-2">
                        <div style="display: flex; gap: 0.5rem; height: 21px;">
                            <label for="issuer">Issuer</label>
                        </div>
                        <input [(ngModel)]="certificateModel.issuer" type="text" name="issuer"
                            class="form-control"autocomplete="off">
                    </div>

                    <div class="input-field mb-2">
                        <div style="display: flex; gap: 0.5rem; height: 21px;">
                            <label for="date">Date</label>
                        </div>
                        <input [(ngModel)]="certificateModel.date" type="date" name="date"
                            class="form-control"autocomplete="off">
                    </div>

                    <div class="input-field mb-2">
                        <div style="display: flex; gap: 0.5rem; height: 21px;">
                            <label for="address">Image</label>
                            <!-- <p *ngIf="!homeImageModel.image" style="color: red; font-size: 14px;">*</p> -->
                        </div>
                        <input type="file" #fileInput (change)="setImage($event, certificateModel)" name="image"
                            class="form-control d-none" id="image" autocomplete="off">
                        <div class="input-group">
                            <img *ngIf="imageSrc" [src]="imageSrc" style="width: 60%; height: 60%;" alt="Selected Image">
                            <img *ngIf="certificateModel.previewImage"  [src]="certificateModel.previewImage" style="width: 60%; height: 60%;" />
                            <div class="input-group-append">
                                <button class="btn" type="button" (click)="triggerFileInput()"><span
                                        class="material-symbols-sharp icons">upload</span></button>
                            </div>
                        </div>
                    </div>

                    <div class="input-field">
                        <div class="btns">
                            <button [disabled]="" class="submit">
                                <i class="fa-solid fa-floppy-disk"></i>
                                Save
                            </button>
                        </div>
                    </div>
                </form>

            </div>
        </div>
    </div>

    @for (certificate of certificates; track certificate) {
    <div class="sales">
        <span class="material-symbols-outlined icons">
            image
        </span>
        <div class="right">
            <div class="input-box">
                <h2>Certificate</h2>
                <form #updateCertificateForm="ngForm" (ngSubmit)="updateCertificate(updateCertificateForm, certificate)">
                    <div class="input-field mb-2">
                        <div style="display: flex; gap: 0.5rem; height: 21px;">
                            <label for="title">Title</label>
                        </div>
                        <input [(ngModel)]="certificate.title" type="text" name="title" class="form-control"
                             autocomplete="off">
                    </div>

                    <div class="input-field mb-2">
                        <div style="display: flex; gap: 0.5rem; height: 21px;">
                            <label for="issuer">Issuer</label>
                        </div>
                        <input [(ngModel)]="certificate.issuer" type="text" name="issuer"
                            class="form-control"autocomplete="off">
                    </div>

                    <div class="input-field mb-2">
                        <div style="display: flex; gap: 0.5rem; height: 21px;">
                            <label for="date">Date</label>
                        </div>
                        <input [(ngModel)]="certificate.date" type="date" name="date"
                            class="form-control"autocomplete="off">
                    </div>

                    <div class="input-field mb-2">
                        <div style="display: flex; gap: 0.5rem; height: 21px;">
                            <label for="image">Image</label>
                            <p *ngIf="!certificate.image" style="color: red; font-size: 14px;">*</p>
                        </div>
                        <input type="file" #fileInput (change)="setImage($event, certificate)" name="image"
                            class="form-control d-none" id="image" autocomplete="off">
                        <div class="input-group">
                            <img *ngIf="certificate.previewImage"  [src]="certificate.previewImage" style="width: 60%; height: 60%;" />
                            <img *ngIf="!certificate.previewImage"  [src]="'https://marqex.webapi.marqexmarine.com/Images/' + certificate.imageUrl" style="width: 60%; height: 60%;" />
                            <div class="input-group-append">
                                <button class="btn" type="button" (click)="triggerFileInput()"><span
                                        class="material-symbols-sharp icons">upload</span></button>
                            </div>
                        </div>
                        <div class="invalid-feedback">
                            Image must be valid.
                        </div>
                    </div>

                    <div class="input-field">
                        <div class="btns">
                            <button [disabled]="" class="submit">
                                <i class="fa-solid fa-floppy-disk"></i>
                                Save
                            </button>
                            <button type="button" (click)="deleteCertificate(certificate.id!)" class="btn btn-danger">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </form>

            </div>
        </div>
    </div>
    }
</div>
