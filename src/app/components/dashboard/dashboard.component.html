<div style="display: flex;">
    <h1>Dashboard</h1>
    <span *ngIf="emptyLayout" (click)="addCard()" style="font-size: 34px; color: green; cursor: pointer;"
        class="material-symbols-outlined ms-3">
        add_circle
    </span>
</div>

<div class="insights">
    <div *ngIf="addCardDiv" class="sales">
        <span class="material-symbols-outlined icons">
            responsive_layout
            </span>
        <div class="right">
            <div class="input-box">
                <h2>Layout</h2>
                <form #createLayoutForm="ngForm" (ngSubmit)="create(createLayoutForm)">
                    <div class="input-field mb-2">
                        <label for="firstName">Slogan</label>
                        <input [(ngModel)]="layoutModel.slogan" type="text" name="slogan" class="form-control"
                            id="slogan" autocomplete="off">
                        <!-- <div class="invalid-feedback">
                            Slogan must be valid.
                        </div> -->
                    </div>
                    <div class="input-field mb-2">
                        <label for="lastName">Footer About Text</label>
                        <textarea [(ngModel)]="layoutModel.shortAboutText" type="text" name="shortAboutText" class="form-control"
                            id="shortAboutText" autocomplete="off" style="height: 200px;"></textarea>
                        <!-- <div class="invalid-feedback">
                            Footer About Text must be valid.
                        </div> -->
                    </div>
                    <div class="input-field mb-2">
                        <label for="profilePicture">Image</label>
                        <input type="file" #fileInput (change)="setImage($event, layoutModel)" name="profilePicture"
                            class="form-control d-none" id="profilePicture" autocomplete="off">
                        <div class="input-group">
                            <img *ngIf="imageSrc" [src]="imageSrc" style="width: 60%; height: 60%;" alt="Selected Image">
                            <div class="input-group-append">
                                <button class="btn" type="button" (click)="triggerFileInput()"><span
                                        class="material-symbols-sharp icons">upload</span></button>
                            </div>
                        </div>
                        <div class="invalid-feedback">
                            Profile picture must be valid.
                        </div>
                    </div>
                    <div class="input-field">
                        <div class="btns">
                            <button [disabled]="" class="submit">
                                <i class="fa-solid fa-floppy-disk"></i>
                                Save
                            </button>
                        </div>
                    </div>
                </form>

            </div>
        </div>
    </div>

    @for (layout of layouts; track layout) {
        <div class="sales">
            <span class="material-symbols-outlined icons">
                responsive_layout
                </span>
            <div class="right">
                <div class="input-box">
                    <h2>Layout</h2>
                    <form #updateLayout="ngForm" (ngSubmit)="update(updateLayout, layout)">
                        <!-- <div class="input-field mb-2">
                            <label for="firstName">Slogan</label>
                            <input [(ngModel)]="layout.slogan" type="text" name="slogan" class="form-control"
                                id="slogan" autocomplete="off">
                        </div> -->
                        <div class="input-field mb-2">
                            <label for="lastName">Footer About Text</label>
                            <textarea [(ngModel)]="layout.shortAboutText" type="text" name="shortAboutText" class="form-control"
                                id="shortAboutText" autocomplete="off" style="height: 200px;"></textarea>
                            <!-- <div class="invalid-feedback">
                                Footer About Text must be valid.
                            </div> -->
                        </div>
                        <div class="input-field mb-2">
                            <label for="profilePicture">Logo</label>
                            <input type="file" #fileInput (change)="setImage($event, layout)" name="profilePicture"
                                class="form-control d-none" id="profilePicture" autocomplete="off">
                            <div class="input-group">
                                <!-- <img style="width: 60%; height: 60%;" src="https://marqex.webapi.marqexmarine.com/Images/{{layout.image}}" alt=""> -->
                                <img *ngIf="layout.previewImage"  [src]="layout.previewImage" style="width: 60%; height: 60%;" />
                                <img *ngIf="!layout.previewImage"  [src]="'https://marqex.webapi.marqexmarine.com/Images/' + layout.image" style="width: 60%; height: 60%;" />
                                <div class="input-group-append">
                                    <button class="btn" type="button" (click)="triggerFileInput()"><span
                                            class="material-symbols-sharp icons">upload</span></button>
                                </div>
                            </div>
                            <!-- <div class="invalid-feedback">
                                Profile picture must be valid.
                            </div> -->
                        </div>
                        <div class="input-field">
                            <div class="btns">
                                <button [disabled]="" class="submit">
                                    <i class="fa-solid fa-floppy-disk"></i>
                                    Save
                                </button>
    
                                <button *ngIf="emptyLayout" (click)="deleteLayoutById(layout.id!)" type="button"  class="btn btn-danger">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </form>
    
                </div>
            </div>
        </div>
    }
</div>
