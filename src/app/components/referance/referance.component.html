<div style="display: flex;">
    <h1>References Page</h1>
    <span (click)="addCard()" style="font-size: 34px; color: green; cursor: pointer;"
        class="material-symbols-outlined ms-3">
        add_circle
    </span>
</div>

<div class="insights">

    <div *ngIf="addCardDiv" class="sales">
        <span class="material-symbols-outlined icons">
            image
        </span>
        <div class="right">
            <div class="input-box">
                <h2>Reference</h2>
                <form #createReferenceForm="ngForm" (ngSubmit)="createReferance(createReferenceForm)">
                    <div class="input-field mb-2">
                        <div style="display: flex; gap: 0.5rem; height: 21px;">
                            <label for="websiteUrl">Website Url</label>
                            <!-- <p *ngIf="!homeImageModel.title" style="color: red; font-size: 14px;">*</p> -->
                        </div>
                        <input [(ngModel)]="referenceModel.websiteUrl" type="text" name="websiteUrl"
                            class="form-control"autocomplete="off">
                    </div>

                    <div class="input-field mb-2">
                        <div style="display: flex; gap: 0.5rem; height: 21px;">
                            <label for="address">Image</label>
                            <!-- <p *ngIf="!homeImageModel.image" style="color: red; font-size: 14px;">*</p> -->
                        </div>
                        <input type="file" #fileInput (change)="setImage($event, referenceModel)" name="image"
                            class="form-control d-none" id="image" autocomplete="off">
                        <div class="input-group">
                            <img *ngIf="imageSrc" [src]="imageSrc" style="width: 60%; height: 60%;" alt="Selected Image">
                            <img *ngIf="referenceModel.previewLogo"  [src]="referenceModel.previewLogo" style="width: 60%; height: 60%;" />
                            <div class="input-group-append">
                                <button class="btn" type="button" (click)="triggerFileInput()"><span
                                        class="material-symbols-sharp icons">upload</span></button>
                            </div>
                        </div>
                    </div>

                    <div class="input-field">
                        <div class="btns">
                            <button [disabled]="" class="submit">
                                <i class="fa-solid fa-floppy-disk"></i>
                                Save
                            </button>
                        </div>
                    </div>
                </form>

            </div>
        </div>
    </div>

    @for (reference of references; track reference) {
    <div class="sales">
        <span class="material-symbols-outlined icons">
            image
        </span>
        <div class="right">
            <div class="input-box">
                <h2>Reference</h2>
                <form #updateReferenceForm="ngForm" (ngSubmit)="updateReference(updateReferenceForm, reference)">
                    <div class="input-field mb-2">
                        <div style="display: flex; gap: 0.5rem; height: 21px;">
                            <label for="websiteUrl">Website Url</label>
                        </div>
                        <input [(ngModel)]="reference.websiteUrl" type="text" name="websiteUrl" class="form-control"
                             autocomplete="off">
                    </div>

                    <div class="input-field mb-2">
                        <div style="display: flex; gap: 0.5rem; height: 21px;">
                            <label for="address">Logo</label>
                            <p *ngIf="!reference.logo" style="color: red; font-size: 14px;">*</p>
                        </div>
                        <input type="file" #fileInput (change)="setImage($event, reference)" name="image"
                            class="form-control d-none" id="image" autocomplete="off">
                        <div class="input-group">
                            <img *ngIf="reference.previewLogo"  [src]="reference.previewLogo" style="width: 60%; height: 60%;" />
                            <img *ngIf="!reference.previewLogo"  [src]="'https://marqex.webapi.marqexmarine.com/Images/' + reference.logoUrl" style="width: 60%; height: 60%;" />
                            <div class="input-group-append">
                                <button class="btn" type="button" (click)="triggerFileInput()"><span
                                        class="material-symbols-sharp icons">upload</span></button>
                            </div>
                        </div>
                        <div class="invalid-feedback">
                            Image must be valid.
                        </div>
                    </div>

                    <div class="input-field">
                        <div class="btns">
                            <button [disabled]="" class="submit">
                                <i class="fa-solid fa-floppy-disk"></i>
                                Save
                            </button>
                            <button type="button" (click)="deletereference(reference.id!)" class="btn btn-danger">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </form>

            </div>
        </div>
    </div>
    }
</div>
